[project]
name = "hf-presentation"
version = "0.1.0"
description = "Single-file HTML deck on the 2026 OpenAI–Hugging Face agent-swarm incident"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.49",
    "pillow>=13.0.0",
    "fonttools>=4.68.0",
    "brotli>=1.2.1",
    "pytest-xdist>=3.8.0",
    "python-pptx>=1.0.2",
    "lxml>=6.1.3",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
